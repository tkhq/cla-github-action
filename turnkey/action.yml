name: "Turnkey CLA"
description: "CLA Assistant with Turnkey defaults: signatures in tkhq/cla-signatures, tkhq members exempt"
inputs:
  app-id:
    description: "ID of the GitHub App that can write tkhq/cla-signatures and read tkhq members"
    required: true
  private-key:
    description: "Private key of that GitHub App"
    required: true
  path-to-document:
    description: "Absolute HTTPS URL of the CLA. Defaults to CLA.md in the calling repository."
    default: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md
runs:
  using: composite
  steps:
    - name: "Resolve pull request head SHA"
      id: head
      if: github.event.action != 'closed'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        sha="$PR_HEAD_SHA"
        if [ "$EVENT_NAME" = "issue_comment" ]; then
          sha=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/pulls/${ISSUE_NUMBER}" | jq -r .head.sha)
        fi
        [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve a 40-hex PR head SHA"; exit 1; }
        echo "sha=${sha}" >> "$GITHUB_OUTPUT"
    - name: "Mint CLA signatures app token"
      id: app_token
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: tkhq
        repositories: cla-signatures
        permission-contents: write
        permission-members: read
    - name: "Build tkhq member allowlist"
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
      run: |
        set -euo pipefail
        DEPENDABOT_ID=49699333  # dependabot[bot]
        GITHUB_ACTIONS_ID=41898282  # github-actions[bot]
        RENOVATE_ID=29139614  # renovate[bot]
        ids=""
        page=1
        while :; do
          body=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/tkhq/members?per_page=100&page=${page}")
          ids+="$(jq -r '.[].id' <<<"$body")"$'\n'
          [ "$(jq length <<<"$body")" -lt 100 ] && break
          page=$((page + 1))
        done
        list=$(printf '%s\n' "$DEPENDABOT_ID" "$GITHUB_ACTIONS_ID" "$RENOVATE_ID" "$ids" | grep -E '^[0-9]+$' | paste -sd, -)
        echo "::add-mask::${list}"
        echo "CLA_ALLOWLIST_IDS=${list}" >> "$GITHUB_ENV"
    - name: "CLA Assistant"
      id: cla_action
      uses: tkhq/cla-github-action@44731e8bc2120b726d651a1c1d90721411c75eb7
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PERSONAL_ACCESS_TOKEN: ${{ steps.app_token.outputs.token }}
      with:
        path-to-signatures: 'signatures/version1/cla.json'
        path-to-document: ${{ inputs.path-to-document }}
        branch: 'main'
        remote-organization-name: tkhq
        remote-repository-name: cla-signatures
        allowlist-ids: ${{ env.CLA_ALLOWLIST_IDS }}
        required-base-ref: 'main'
        require-opener-as-author: 'true'
        expected-head-sha: ${{ steps.head.outputs.sha }}
    - name: "Publish CLA commit status"
      if: always() && github.event.action != 'closed' && steps.head.outputs.sha != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ steps.head.outputs.sha }}
        ACTION_OUTCOME: ${{ steps.cla_action.outcome }}
        CLA_PASSED: ${{ steps.cla_action.outputs.cla_passed }}
        TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        state=failure
        if [ "$ACTION_OUTCOME" = "success" ] && [ "$CLA_PASSED" = "true" ]; then state=success; fi
        curl --fail --silent --show-error -X POST \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          "https://api.github.com/repos/${REPO}/statuses/${SHA}" \
          -d "{\"state\":\"${state}\",\"context\":\"CLA\",\"target_url\":\"${TARGET_URL}\"}"
