name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [opened,edited,closed,reopened,synchronize,ready_for_review]

permissions: {}

jobs:
  CLA:
    uses: tkhq/cla-github-action/.github/workflows/cla.yml@b18d7c2272f5d9863cf316c9c47254604109e137
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    secrets:
      CLA_APP_ID: ${{ secrets.CLA_APP_ID }}
      CLA_APP_PRIVATE_KEY: ${{ secrets.CLA_APP_PRIVATE_KEY }}
