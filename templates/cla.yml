name: CLA

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  cla:
    uses: tkhq/cla-github-action/.github/workflows/cla.yml@1ce01b8584f4cb60f1d17df6e9daf8cc10a78c20 # v1
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    secrets: inherit
