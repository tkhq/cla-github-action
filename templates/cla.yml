name: CLA

on:
  # The called workflow never checks out pull request code.
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.state == 'open' &&
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, 'recheck') ||
      contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')))
    uses: tkhq/cla-github-action/.github/workflows/cla.yml@51d0ad15e03e9187efaa9808a8bab63e712df25c # pin: 51d0ad1
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    secrets:
      CLA_APP_ID: ${{ secrets.CLA_APP_ID }}
      CLA_APP_PRIVATE_KEY: ${{ secrets.CLA_APP_PRIVATE_KEY }}
